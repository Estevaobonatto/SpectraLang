apiVersion: apps/v1
kind: Deployment
metadata:
  name: spectralang-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spectralang-api
  template:
    metadata:
      labels:
        app: spectralang-api
    spec:
      containers:
        - name: api
          image: spectralang-api:local
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
