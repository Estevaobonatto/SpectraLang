[package]
name = "spectra-cli"
version = "0.1.18"
edition = "2021"

[features]
default = []
gpu = ["spectra-runtime/gpu"]

[[bin]]
name = "spectralang"
path = "src/main.rs"

[dependencies]
spectra-compiler = { path = "../../compiler" }
spectra-midend = { path = "../../midend" }
spectra-backend = { path = "../../backend" }
spectra-api = { path = "../../packages/spectra-api" }
spectra-runtime = { path = "../../runtime" }
toml = "0.8"
diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
