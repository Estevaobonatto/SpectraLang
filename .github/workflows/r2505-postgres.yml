name: R-2505 PostgreSQL driver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/spectra-db/**'
      - 'packages/spectra-api/src/db.rs'
      - 'packages/spectra-api/src/lib.rs'
      - 'packages/spectra-api/tests/postgres_http_parent.rs'
      - 'packages/spectra-api/tests/postgres_task_bridge.rs'
      - 'runtime/src/stdlib/mod.rs'
      - 'runtime/src/tracing/mod.rs'
      - 'compiler/src/semantic/builtin_modules.rs'
      - 'midend/src/lowering.rs'
      - 'tests/validation/195_postgres_driver.spectra'
      - 'tests/fixtures/r2505/collector.py'
      - 'scripts/validate_r2505_postgres.py'
      - 'scripts/test_validate_r2505_postgres.py'
      - 'scripts/run_phase25_postgres.ps1'
      - 'run_tests.ps1'
      - '.github/workflows/r2505-postgres.yml'
  push:
    paths:
      - 'packages/spectra-db/**'
      - 'packages/spectra-api/src/db.rs'
      - 'packages/spectra-api/src/lib.rs'
      - 'packages/spectra-api/tests/postgres_http_parent.rs'
      - 'packages/spectra-api/tests/postgres_task_bridge.rs'
      - 'runtime/src/stdlib/mod.rs'
      - 'runtime/src/tracing/mod.rs'
      - 'compiler/src/semantic/builtin_modules.rs'
      - 'midend/src/lowering.rs'
      - 'tests/validation/195_postgres_driver.spectra'
      - 'tests/fixtures/r2505/collector.py'
      - 'scripts/validate_r2505_postgres.py'
      - 'scripts/test_validate_r2505_postgres.py'
      - 'scripts/run_phase25_postgres.ps1'
      - 'run_tests.ps1'
      - '.github/workflows/r2505-postgres.yml'

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
          POSTGRES_DB: spectra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spectra -d spectra_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install independent PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build CLI
        run: cargo build -p spectra-cli
      - name: Validate R-2505 against PostgreSQL 16
        env:
          SPECTRA_POSTGRES_URL: postgres://spectra:spectra@127.0.0.1:5432/spectra_test
        run: |
          python scripts/validate_r2505_postgres.py \
            --binary target/debug/spectralang \
            --fixture tests/validation/195_postgres_driver.spectra \
            --database-url "$SPECTRA_POSTGRES_URL" \
            --require-database \
            --report target/r2505-postgres/report.json
      - name: Verify certifying report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("target/r2505-postgres/report.json").read_text())
          assert report["schema"] == "spectralang.r2505_postgres.v2"
          assert report["status"] == "passed"
          assert not report["failures"]
          PY
      - name: Publish R-2505 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2505-postgres
          path: target/r2505-postgres/
