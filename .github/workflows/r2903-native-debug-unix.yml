name: R-2903 native debug Unix lane

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'midend/**'
      - 'tools/spectra-cli/**'
      - 'scripts/validate_r2903_native_debug.py'
      - 'tests/validation/191_native_debug_info.spectra'

jobs:
  dwarf-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install native debug tools
        run: sudo apt-get update && sudo apt-get install -y llvm gdb
      - name: Build CLI and runtime
        run: cargo build -p spectra-cli
      - name: Validate DWARF and debugger evidence
        run: |
          python scripts/validate_r2903_native_debug.py \
            --binary target/debug/spectralang \
            --fixture tests/validation/191_native_debug_info.spectra \
            --report target/r2903-native-debug/report.json
      - name: Publish R-2903 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2903-native-debug-unix
          path: target/r2903-native-debug/
