name: CI

on:
  push:
    branches:
      - main
      - master
      - "ai/**"
  pull_request:
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run npm audit for VS Code extension
        working-directory: tools/vscode-extension
        run: npm audit --audit-level=high

  cargo-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: dependency-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  package-offline:
    name: Reproducible offline package gate
    runs-on: ubuntu-latest
    needs: cargo-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Spectra package caches
        uses: actions/cache@v4
        with:
          path: |
            .spectra/git
            .spectra/packages
            spectra.lock
          key: spectra-packages-${{ runner.os }}-${{ hashFiles('**/spectra.lock') }}

      - name: Build CLI
        run: cargo build -q -p spectra-cli

      - name: Validate offline and locked package flow
        run: python scripts/validate_r913_offline_reproducible.py --binary target/debug/spectralang
