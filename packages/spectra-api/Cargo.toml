[package]
name = "spectra-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
spectra-runtime = { path = "../../runtime" }
spectra-db = { path = "../spectra-db" }
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
