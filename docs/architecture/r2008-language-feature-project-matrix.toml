required_files = [
  "Spectra.toml",
  "src/main.spectra",
  "src/domain.spectra",
  "src/control_flow.spectra",
]
status = "planned"
expected_outcome = "CLI execution proves runtime behavior for core constructs with observable output and no parser-only acceptance."
