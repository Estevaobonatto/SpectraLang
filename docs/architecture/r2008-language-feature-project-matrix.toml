schema = "spectralang.r2008_language_feature_project_matrix.v1"
roadmap_item = "R-2008"
version = 1
status = "complete"
summary = "Integrated project validation matrix for basic language components and AI Support features."
project_contract = [
  "each planned project is a checked-in .spectra project under tests/projects/valid/integrated_*",
  "each project contains Spectra.toml plus src/*.spectra and tests/*.spectra files when package validation is required",
  "runtime scenarios use src/main.spectra as the executable entrypoint",
  "package scenarios use package-level tests instead of isolated parser fixtures",
  "runner evidence records the exact command, expected output, and failure classification",
]

required_features = [
  "modules",
  "functions",
  "structs_classes",
  "traits",
  "generics",
  "closures",
  "control_flow",
  "stdlib",
  "tensors",
  "autodiff",
  "graph_fusion",
  "data",
  "experiment",
  "onnx",
  "rag",
  "serving",
  "evaluation",
  "monitoring",
]

allowed_commands = [
  "spectralang run",
  "spectralang package check",
  "spectralang package test",
]

gap_roadmap_items = [
  "R-2009",
  "R-2010",
  "R-2011",
  "R-2012",
  "R-2013",
]

[[projects]]
id = "basic_components_package"
title = "Basic Components Package Test"
category = "basic_components"
roadmap_item = "R-2009"
owner = "tooling"
command = "spectralang package test"
exact_command = "spectralang package test tests/projects/valid/integrated_basic_components"
project_path = "tests/projects/valid/integrated_basic_components"
entrypoint = "src/main.spectra"
required_files = [
  "Spectra.toml",
  "src/main.spectra",
  "src/components.spectra",
  "src/traits.spectra",
  "tests/core_language_package.spectra",
]
status = "planned"
expected_outcome = "Package tests assert behavior across modules, imports, functions, methods, structs/classes, traits, generics, closures, enums, match, loops, error paths, and stdlib composition."
features = [
  "modules",
  "functions",
  "structs_classes",
  "traits",
  "generics",
  "closures",
  "control_flow",
  "stdlib",
]

